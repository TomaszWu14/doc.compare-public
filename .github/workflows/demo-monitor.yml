name: Monitor demo

# Co 6 godzin sprawdza publiczne demo (https://doc.compare.twapp.pl). Na demo działa bramka
# odwiedzin (blueprints/demo_gate.py): niezalogowany gość z / i /login trafia na /demo-gate.
# Dlatego sprawdzamy ścieżki wyłączone z bramki: /health i /demo-gate muszą zwrócić 200,
# a / — 200 albo przekierowanie na /demo-gate (lub /login, gdy bramka jest wyłączona).
# Awaria → issue „Demo nie odpowiada” z etykietą `demo` (jedno, kolejne awarie dopisują komentarz);
# pierwszy udany przebieg po awarii zamyka issue. GITHUB_TOKEN + opcjonalny sekret NTFY_URL (push ntfy).
on:
  schedule:
    - cron: '17 */6 * * *'   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://doc.compare.twapp.pl
  LABEL: demo
  TITLE: Demo nie odpowiada

jobs:
  check:
    name: Demo odpowiada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź /health, /demo-gate i /
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          # Zwraca "<kod HTTP> <adres przekierowania>"; bez -L, żeby widzieć samo przekierowanie.
          probe() {
            curl -sS -o /dev/null --max-time 30 --retry 3 --retry-delay 15 --retry-all-errors \
              -w '%{http_code} %{redirect_url}' "$DEMO_URL$1" 2>/dev/null || echo "000 "
          }

          read -r code _ <<<"$(probe /health)"
          [ "$code" = 200 ] || problems+=("/health zwraca HTTP $code (oczekiwane 200)")

          read -r code _ <<<"$(probe /demo-gate)"
          [ "$code" = 200 ] || problems+=("/demo-gate zwraca HTTP $code (oczekiwane 200)")

          read -r code location <<<"$(probe /)"
          case "$code" in
            200) ;;
            301|302|303|307|308)
              [[ "$location" == */demo-gate* || "$location" == */login* ]] \
                || problems+=("/ przekierowuje na ${location:-?} zamiast na /demo-gate lub /login") ;;
            *) problems+=("/ zwraca HTTP $code (oczekiwane 200 albo przekierowanie na /demo-gate lub /login)") ;;
          esac

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo $DEMO_URL odpowiada." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL — problemy ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: doc.compare-public" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów odpowiada ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: doc.compare-public" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
