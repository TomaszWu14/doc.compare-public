name: Deploy — demo (Coolify)

# Po zielonym CI na main zleca Coolify przebudowę demo
# (https://doc.compare.twapp.pl). Zmiany tylko w *.md / docs/ nie uruchamiają
# CI, więc nie wdrażają się — demo ich nie potrzebuje.
#
# Sekret COOLIFY_TOKEN: token API Coolify z uprawnieniem "deploy".

on:
  workflow_run:
    workflows: ["CI — testy jednostkowe"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-demo
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOY_URL: "https://coolify.twapp.pl/api/v1/deploy?uuid=h48sw55svsszr3fx0qgd0scl&force=false"
        # Coolify accepted GET until 2026-10-12; on 2026-10-17 it returned 405.
        # Try GET first, fall back to POST on 405 so both API variants work.
        run: |
          code=$(curl -sS --max-time 30 -o resp.txt -w '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_TOKEN" "$DEPLOY_URL")
          if [ "$code" = "405" ]; then
            echo "GET returned 405, retrying with POST"
            code=$(curl -sS --max-time 30 -o resp.txt -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_TOKEN" "$DEPLOY_URL")
          fi
          echo "Coolify HTTP $code"
          head -c 500 resp.txt; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
