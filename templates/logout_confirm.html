<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Wylogowanie — DocCompare</title>
{% include "_favicon.html" %}
<style>
:root{--bg:#0f1119;--surface:#181b27;--border:#252840;--accent:#5b9bff;--text:#edf0f7;--muted:#7a84a0;--error:#ff5c5c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
h1{font-size:20px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.6}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{opacity:.88}
.err{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--error);margin-bottom:16px}
.back{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--text)}
</style>
</head>
<body>
<main class="card">
  <h1>Wylogowanie</h1>
  <p class="sub">Czy na pewno chcesz się wylogować z DocCompare?</p>
  {% if error %}<div class="err" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/logout">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="btn">Wyloguj</button>
  </form>
  <a href="/" class="back">Wróć do aplikacji</a>
</main>
{% include '_tracking_pixel.html' %}
</body>
</html>
